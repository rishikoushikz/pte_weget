conky.config = {
    -- Weget Core Engine — Conky Configuration
    out_to_wayland = false,
    out_to_x = true,

    alignment = 'top_right',
    gap_x = 26,
    gap_y = 54,
    minimum_width = 350,
    maximum_width = 350,
    minimum_height = 820,

    own_window = true,
    own_window_type = 'normal',
    own_window_title = 'weget_macwidget',
    own_window_class = 'weget_macwidget',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_colour = '000000',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    double_buffer = true,
    forced_redraw = false,
    use_xft = true,
    font = 'Noto Sans:size=10',
    override_utf8_locale = true,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    stippled_borders = 0,
    border_width = 0,

    update_interval = 0.25,
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    lua_load = (function()
        local candidates = {
            os.getenv('HOME') .. '/.config/conky/macwidget/macwidget.lua',
            'macwidget.lua',
            '/usr/share/weget/macwidget.lua',
            (os.getenv('HOME') or '') .. '/.local/share/weget/macwidget.lua'
        }
        for _, p in ipairs(candidates) do
            local f = io.open(p, 'r')
            if f then f:close(); return p end
        end
        return (os.getenv('HOME') or '') .. '/.config/conky/macwidget/macwidget.lua'
    end)(),
    lua_draw_hook_pre = 'draw_widgets',
    lua_mouse_hook = 'mouse_event',
}

-- Rendering is handled by Cairo in macwidget.lua
conky.text = [[]]
