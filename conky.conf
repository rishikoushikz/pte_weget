local settings = (function()
    local home = os.getenv('HOME') or ''
    local candidates = {
        home .. '/.config/conky/macwidget/settings/settings.json',
        'engine/settings/settings.json',
        'settings.json'
    }
    for _, p in ipairs(candidates) do
        local f = io.open(p, 'r')
        if f then
            local str = f:read('*a')
            f:close()
            return str
        end
    end
    return nil
end)()

local alignment = 'top_right'
local gap_x = 26
local gap_y = 54
local scale = 1.0
local row_count = 4

if settings then
    local align = settings:match('"position"%s*:%s*"([^"]+)"')
    if align and align ~= '' then alignment = align end

    local gx = settings:match('"gap_x"%s*:%s*(%d+)')
    if gx then gap_x = tonumber(gx) or 26 end

    local gy = settings:match('"gap_y"%s*:%s*(%d+)')
    if gy then gap_y = tonumber(gy) or 54 end

    local sc = settings:match('"scale"%s*:%s*([%d%.]+)')
    if sc then
        local n = tonumber(sc) or 1.0
        if n >= 0.4 and n <= 3.0 then scale = n end
    end

    local rows = 0
    local row_order = settings:match('"row_order"%s*:%s*%[(.-)%]')
    if row_order then
        for _ in row_order:gmatch('"([%w_]+)"') do rows = rows + 1 end
    end
    if rows == 0 then
        local slots_block = settings:match('"slots"%s*:%s*{(.-)}')
        if slots_block then
            local seen = {}
            for k in slots_block:gmatch('"([%w_]+)"%s*:') do
                local r = k:sub(1, 1)
                if not seen[r] then
                    seen[r] = true
                    rows = rows + 1
                end
            end
        end
    end
    if rows > 0 then row_count = rows end
end

local win_w = math.floor(350 * scale + 0.5)
local win_h = math.floor((row_count * 155 + 10) * scale + 0.5)
if win_h < 300 then win_h = 300 end

local top_panel_offset = (function()
    local f = io.popen('xprop -root _NET_WORKAREA 2>/dev/null')
    if f then
        local s = f:read('*a')
        f:close()
        local y = s:match('_NET_WORKAREA%(CARDINAL%)%s*=%s*%d+,%s*(%d+)')
        if y then
            local n = tonumber(y)
            if n and n > 0 and n < 100 then return n end
        end
    end
    return 34
end)()

local final_gap_y = gap_y
if alignment:find('top') then
    final_gap_y = top_panel_offset + gap_y
end

conky.config = {
    -- Weget Core Engine — Conky Configuration
    out_to_wayland = false,
    out_to_x = true,

    alignment = alignment,
    gap_x = gap_x,
    gap_y = final_gap_y,
    minimum_width = win_w,
    maximum_width = win_w,
    minimum_height = win_h,

    own_window = true,
    own_window_type = 'normal',
    own_window_title = 'weget_macwidget',
    own_window_class = 'weget_macwidget',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_colour = '000000',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    double_buffer = true,
    forced_redraw = false,
    use_xft = true,
    font = 'Noto Sans:size=10',
    override_utf8_locale = true,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    stippled_borders = 0,
    border_width = 0,

    update_interval = 0.25,
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    lua_load = (function()
        local candidates = {
            os.getenv('HOME') .. '/.config/conky/macwidget/macwidget.lua',
            'macwidget.lua',
            '/usr/share/weget/macwidget.lua',
            (os.getenv('HOME') or '') .. '/.local/share/weget/macwidget.lua'
        }
        for _, p in ipairs(candidates) do
            local f = io.open(p, 'r')
            if f then f:close(); return p end
        end
        return (os.getenv('HOME') or '') .. '/.config/conky/macwidget/macwidget.lua'
    end)(),
    lua_draw_hook_pre = 'draw_widgets',
    lua_mouse_hook = 'mouse_event',
}

-- Rendering is handled by Cairo in macwidget.lua
conky.text = [[]]
